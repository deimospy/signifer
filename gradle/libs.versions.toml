[versions]
agp = "8.9.1"
kotlin = "2.1.0"
coroutines = "1.9.0"
camera = "1.4.1"
core = "1.15.0"
appcompat = "1.7.0"
activity = "1.9.3"
constraintlayout = "2.2.0"
lifecycle = "2.8.7"
material = "1.12.0"
zxingcpp = "2.3.0"
zxingcore = "3.5.3"
junit = "4.13.2"
json = "20240303"
androidx-test-junit = "1.2.1"
androidx-test-runner = "1.6.2"

[libraries]
# Lectura: C++20, sin dependencias de terceros, Apache-2.0.
zxingcpp = { module = "io.github.zxing-cpp:android", version.ref = "zxingcpp" }
# Generacion: el wrapper Android de zxing-cpp solo trae lector.
zxing-core = { module = "com.google.zxing:core", version.ref = "zxingcore" }

kotlin-coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }

androidx-core = { module = "androidx.core:core-ktx", version.ref = "core" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-activity = { module = "androidx.activity:activity-ktx", version.ref = "activity" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintlayout" }
androidx-lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
material = { module = "com.google.android.material:material", version.ref = "material" }

camera-core = { module = "androidx.camera:camera-core", version.ref = "camera" }
camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camera" }
camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camera" }
camera-view = { module = "androidx.camera:camera-view", version.ref = "camera" }

junit = { module = "junit:junit", version.ref = "junit" }
json = { module = "org.json:json", version.ref = "json" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-junit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
